plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.chinesetv.app'
    compileSdk 36

    def releaseStoreFile = System.getenv('RELEASE_STORE_FILE')
    def releaseStorePassword = System.getenv('RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('RELEASE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD')

    defaultConfig {
        applicationId 'cn.chinesetv.app'
        minSdk 14
        targetSdk 28
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }
}
